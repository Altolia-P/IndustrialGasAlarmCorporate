server:
  port: 8080

spring:
  main:
    allow-bean-definition-overriding: true
  profiles:
    active: local

  sql:
    init:
      mode: never

  datasource:
    url: jdbc:mysql://localhost:3306/industrial_gas_alarm_corp?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  cache:
    type: redis
    redis:
      time-to-live: 3600000          # 默认缓存1小时
      cache-null-values: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  global-config:
    db-config:
      id-type: none                   # UUID由应用层生成
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000               # 24小时 (ms)

# 事件发件箱轮询（MVP 阶段关闭，微服务拆分后开启）
event-outbox:
  enabled: false                      # 是否启用定时投递
  polling-interval: 5000              # 轮询间隔 (ms)
  max-retry: 5                        # 最大重试次数
  batch-size: 50                      # 每次投递批次大小

# 操作日志
operation-log:
  enabled: true
  retention-days: 180                 # 日志保留天数

file:
  upload:
    path: ./uploads                    # 上传文件存储目录
    allowed-extensions: jpg, jpeg, png, webp
    max-size: 5242880                 # 5MB

# CORS 跨域配置（生产环境在 application-prod.yml 中覆盖）
app:
  cors:
    allowed-origins: ${CORS_ORIGINS:*}
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,X-Trace-Id
    max-age: 3600

# API Token 认证（X-API-Key）
api-token-filter:
  shared-key: ${API_TOKEN_SHARED_KEY:}
  dev-mode: ${API_TOKEN_DEV_MODE:false}
  dev-token: ${API_TOKEN_DEV_TOKEN:}

logging:
  file:
    path: ./logs
  level:
    com.niit.industrialgasalarmcorporate: DEBUG
    com.baomidou.mybatisplus: INFO

# DeepSeek AI 配置
deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: https://api.deepseek.com
  model-name: deepseek-v4-flash
#  temperature: 0.7
  max-tokens: 2000
  timeout-seconds: 20
  embedding:
    # 向量检索用 Embedding 模型，需单独配置（DeepSeek 暂不支持 embedding，建议用阿里云 DashScope 或 OpenAI）
    api-key: ${DEEPSEEK_EMBEDDING_API_KEY:${DEEPSEEK_API_KEY:}}
    base-url: ${DEEPSEEK_EMBEDDING_BASE_URL:https://api.deepseek.com}
    model-name: ${DEEPSEEK_EMBEDDING_MODEL:text-embedding-3-small}
