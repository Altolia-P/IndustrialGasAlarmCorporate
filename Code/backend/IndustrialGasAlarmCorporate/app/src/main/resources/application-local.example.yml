# 本地开发配置模板
# 复制此文件为 application-local.yml，填入你的本地密码
# application-local.yml 已加入 .gitignore，不会提交到 Git

spring:
  datasource:
    password: 你的数据库密码

  data:
    redis:
      password: 你的Redis密码（没有则留空）

jwt:
  secret: 填写至少 32 个字符（256 位）的随机字符串。未设置时将自动生成随机密钥（仅开发可用），生产环境必须显式设置

# API Token 认证（X-API-Key）
# 预共享密钥方式调用 API，适合外部系统集成
# api-token-filter:
#   shared-key: your-shared-api-key
#   dev-mode: true                    # 开启开发模式后，可额外使用 dev-token 放行
#   dev-token: your-dev-test-token

deepseek:
  api-key: 你的DeepSeek API Key（从 https://platform.deepseek.com 获取）
  # embedding 向量检索建议用阿里云 DashScope text-embedding-v3（OpenAI 兼容）
  # embedding:
  #   api-key: 你的Embedding API Key
  #   base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  #   model-name: text-embedding-v3